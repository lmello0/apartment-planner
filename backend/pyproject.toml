[project]
name = "apartment-planner-backend"
version = "0.1.0"
description = "Backend of apartment-planner: contract schedule, payments, milestones and tasks."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy>=2.0",
    "tzdata",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pgserver>=0.1.4",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
