<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">166</span>
      <span class="brand__text">Planejador<br />do Apê</span>
    </div>
    <nav aria-label="Principal">
      @for (n of nav; track n.path) {
        <a [routerLink]="n.path" routerLinkActive="active" ariaCurrentWhenActive="page">
          <i class="pi" [class]="n.icon" aria-hidden="true"></i>
          <span>{{ n.label }}</span>
        </a>
      }
    </nav>
    <div class="side__foot">
      <span class="who">{{ auth.email() }}</span>
    </div>
  </aside>
  <main id="conteudo" class="content">
    <router-outlet />
  </main>
</div>
<app-payment-dialog />
